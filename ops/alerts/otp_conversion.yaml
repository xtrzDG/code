# Login codes of the last hour that settled (used, or expired unused):
# when most were never used, codes go to numbers nobody signs in
# with (SMS pumping through sign-in). The message names the countries
# with the most unused codes. Sign-in throttles itself before this alert:
# a number range whose codes to new phones of the last six hours went
# unused gets no code, and such a country's cap of codes to new phones
# drops to 10 an hour, until the unused codes are six hours old
# (app/use_cases/users/otp_login/login_code_conversion.py).
code: otp_conversion
severity: sev2
summary: More than 70 % of the login codes sent in the last hour were never used.
measure: share of settled login codes of the last hour that were never used
threshold: 70
unit: percent
window_minutes: 60
volume_floor: 20
source: otp_challenges by created_at (otp_challenges_doc_created_at_idx)
runbook: docs/operations/runbooks/tenant-sms-volume.md
