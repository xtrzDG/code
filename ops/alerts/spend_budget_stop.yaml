# The platform budget stop: the providers' spend of the current UTC day
# reached PLATFORM_DAILY_SPEND_STOP_PERCENT (100 by default) of
# PLATFORM_DAILY_SPEND_BUDGET_USD (unset: never fires). The spend guard
# stops on the same reading (one sum a minute per process): every
# assistant hands its customers to the team and calls go to the
# forwarding number until UTC midnight. The figure is the percent of the
# budget used; the check shows the configured stop as its threshold
# (the warning comes earlier, from spend_budget at 80%).
code: spend_budget_stop
severity: sev1
summary: Today's provider spend reached the daily budget stop; every assistant hands customers to the team until UTC midnight.
measure: today's provider spend (UTC) as a percent of the daily budget
threshold: 100
unit: percent
window_minutes: 1440
volume_floor: 0
source: usage_events BRIN (doc_occurred_at), migration 1142
runbook: docs/operations/runbooks/platform-brakes.md
