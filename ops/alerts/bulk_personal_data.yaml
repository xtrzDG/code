# One business exported or erased personal data far more often than an
# owner does by hand: a stolen owner session or API key draining the
# customers, or a script gone wrong. Exports are every EXPORT entry of the
# audit log (CSV and full exports, a contact's data, billing documents),
# erasures every DELETE of a contact. The figure is the highest count of
# one business in the last hour; the detail names that business.
code: bulk_personal_data
severity: sev2
summary: One business exported or erased personal data more than 20 times in an hour.
measure: exports and contact erasures of the busiest business in the last hour
threshold: 20
unit: count
window_minutes: 60
volume_floor: 0
source: audit_log_entries by action and time (audit_log_entries_doc_action_idx), migration 1193
runbook: docs/operations/runbooks/audit-anomaly.md
