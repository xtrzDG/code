# API requests that took longer than 2 s (platform signal
# slow_api_request, counted by the API processes, at most one a second
# per process) against every API request of the same 30 minutes (the
# api_availability service level slots). Health probes do not count.
code: api_latency
severity: sev2
summary: More than 5 % of API requests took longer than 2 s in the last 30 minutes.
measure: share of API requests slower than 2 s in the last 30 minutes
threshold: 5
unit: percent
window_minutes: 30
volume_floor: 200
source: rate_limit_buckets (platform-signal:slow_api_request); service_level_slots (api_availability)
runbook: docs/operations/runbooks/api-latency.md
