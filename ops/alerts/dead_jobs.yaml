# Background jobs that ran out of attempts: a reply, a notification or an
# import that will never happen unless someone retries or discards it.
code: dead_jobs
severity: sev2
summary: Background jobs ran out of attempts and wait in the dead letters.
# Fires when the figure is above the threshold: any dead job at all.
measure: dead queued jobs, by job name
threshold: 0
unit: count
window_minutes: 5
volume_floor: 0
source: queued_jobs (doc_status, doc_lane, doc_run_at) include (doc_name), migration 1093
runbook: docs/operations/runbooks/stuck-worker.md
