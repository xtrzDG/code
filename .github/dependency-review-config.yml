# Dependency review of every pull request (SDLC-02): the step
# "Dependencies this pull request changes" of the job "security" in
# ci.yml reads this file. It looks at the dependencies a pull request adds
# or updates (GitHub's dependency graph of uv.lock and the package-lock
# files) and fails on an advisory of high or critical severity, or on a
# licence the platform cannot ship to its customers' businesses (strong
# copyleft that reaches a hosted service, source-available or
# non-commercial terms). The OpenSSF Scorecard of each changed package is
# shown with a warning below level 3 (maintenance, archival, publishers).
fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
vulnerability-check: true
license-check: true
deny-licenses:
  - AGPL-1.0-only
  - AGPL-1.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - SSPL-1.0
  - BUSL-1.1
  - CC-BY-NC-4.0
  - CC-BY-NC-SA-4.0
# Reviewed exceptions, each with its reason:
# - pyphen (hyphenation inside WeasyPrint, which renders the PDF documents)
#   is offered under GPL-2.0+, LGPL-2.1+ or MPL-1.1 at the user's choice;
#   the platform takes it under MPL-1.1.
allow-dependencies-licenses:
  - pkg:pypi/pyphen
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
comment-summary-in-pr: never
