# Trivy's secret scanner on the published images (.github/workflows/ci.yml,
# job "images"; image-rescan.yml): it looks for keys and tokens in the
# image's files and settings, where a secret of ours would be (app/,
# docs/legal, docs/help, the cabinet's .next build, public/, the image's
# environment). These paths hold third-party code installed from the
# lockfiles, which ships test fixtures and documentation that read like
# keys (the Anthropic SDK's service-account examples, for one); a secret
# of ours never lands there. Reviewed 2026-11-02; look again when an image
# installs into a new place.
allow-rules:
  - id: backend-python-packages
    description: Packages installed from uv.lock into the backend's virtual environment
    path: ^app/\.venv/lib/python3\.\d+/site-packages/
  - id: cabinet-node-packages
    description: Packages installed from web/package-lock.json
    path: ^web/node_modules/
  - id: python-standard-library
    description: The official Python image's standard library
    path: ^usr/local/lib/python3\.\d+/
