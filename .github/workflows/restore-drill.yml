name: Restore drill

# Backups are proven by restoring them (docs/operations/backup-restore.md):
#
# - round-trip, nightly, on demand and when the backup code changes: this
#   checkout backs up a seeded throwaway database to a local S3 server and
#   restores it again with every check of the drill;
# - production, on Mondays and on demand: production's newest backup
#   (the code of `release`) restored into a throwaway Postgres 16 and
#   checked, with a Sentry Crons check-in (monitor restore-drill). It runs
#   only when the repository variable BACKUP_S3_BUCKET is set; its secrets
#   live in the environment backup-drill.
on:
  schedule:
    - cron: "23 2 * * *"
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      production:
        description: "Also restore production's newest backup"
        type: boolean
        default: false
  pull_request:
    paths:
      - app/adapters/backup/**
      - app/clients/object_storage/**
      - app/gateways/cli/backup*.py
      - app/gateways/cli/restore_check.py
      - app/use_cases/maintenance/backups/**
      - app/utilities/backups/**
      - app/utilities/security/age/**
      - migrations/**
      - .github/workflows/restore-drill.yml

permissions:
  contents: read

concurrency:
  group: restore-drill-${{ github.ref }}
  cancel-in-progress: false

# Every `uses:` is pinned to a commit SHA (the comment names the release).
env:
  UV_FROZEN: "1"
  # The image's pg_dump is Debian's 17; an archive opens only with a
  # pg_restore at least as new.
  POSTGRES_CLIENT_BIN_DIRECTORY: /usr/lib/postgresql/17/bin

jobs:
  round-trip:
    name: Back up and restore a throwaway database (this checkout)
    if: github.event_name != 'schedule' || github.event.schedule == '23 2 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      LLM_PROVIDER: scripted
      ENCRYPTION_KEY: restore-drill-round-trip-key-0123456789abcdef # gitleaks:allow
      DATABASE_URL: postgresql://workshop:workshop@localhost:5432/workshop
      RESTORE_CHECK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BACKUP_S3_ENDPOINT_URL: http://127.0.0.1:9000
      BACKUP_S3_REGION: eu-central-1
      BACKUP_S3_BUCKET: workshop-backups-drill
      BACKUP_S3_ACCESS_KEY_ID: drill
      BACKUP_S3_SECRET_ACCESS_KEY: drill-secret # gitleaks:allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the Postgres 17 client and age
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          "$POSTGRES_CLIENT_BIN_DIRECTORY/pg_dump" --version
          age --version

      - name: Install dependencies
        run: uv sync --frozen

      # Before any command reads the settings: a bucket without a public
      # key is refused.
      - name: Keys of this run (age)
        run: |
          age-keygen --output "$RUNNER_TEMP/key.txt" 2> /dev/null
          identity="$(grep '^AGE-SECRET-KEY-' "$RUNNER_TEMP/key.txt")"
          echo "::add-mask::$identity"
          {
            echo "BACKUP_AGE_IDENTITY=$identity"
            echo "BACKUP_AGE_PUBLIC_KEY=$(age-keygen -y "$RUNNER_TEMP/key.txt")"
          } >> "$GITHUB_ENV"

      - name: Application role and database, as in production
        env:
          PGPASSWORD: postgres
        run: |
          psql --host localhost --username postgres --set ON_ERROR_STOP=1 <<'SQL'
          create role workshop login password 'workshop'
            nosuperuser nobypassrls nocreatedb nocreaterole;
          create database workshop owner workshop;
          SQL

      - name: Migrate and seed realistic rows
        run: |
          uv run python -m app.gateways.cli.migrate
          uv run python -m app.gateways.cli.seed_load --businesses 4 \
            --messages 2000 --bookings 200 --visitors 10 --manifest "$RUNNER_TEMP/manifest.json"

      - name: S3 bucket (a local moto server)
        run: |
          uv run moto_server --host 127.0.0.1 --port 9000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:9000/moto-api/ > /dev/null && break
            sleep 1
          done
          curl --silent --fail --request PUT "$BACKUP_S3_ENDPOINT_URL/$BACKUP_S3_BUCKET"

      - name: workshop backup
        run: uv run python -m app.gateways.cli.backup --work-directory "$RUNNER_TEMP/backup"

      - name: workshop restore-check
        run: uv run python -m app.gateways.cli.restore_check --work-directory "$RUNNER_TEMP/drill"

      # The disaster runbook decrypts with the age tool, not with this code.
      - name: The archive opens with the age tool as well
        run: |
          uv run python - "$RUNNER_TEMP/archive.age" <<'PY'
          import os
          import sys

          from app.gateways.cli.backup_wiring import build_bucket
          from app.schemas.typings.platform.strings import LocalFilePath
          from app.utilities.backups.backup_keys import recognize_archives
          from app.utilities.config_helpers.app_settings.app_settings_assembler import (
              assemble_app_settings,
          )

          backup = assemble_app_settings(os.environ).backup
          assert backup.bucket is not None
          bucket = build_bucket(backup.bucket)
          newest = recognize_archives(bucket.list_objects(backup.prefix), backup.prefix)[-1]
          assert bucket.download_file(newest.key, LocalFilePath(sys.argv[1]))
          print(newest.key)
          PY
          age --decrypt --identity "$RUNNER_TEMP/key.txt" "$RUNNER_TEMP/archive.age" \
            | "$POSTGRES_CLIENT_BIN_DIRECTORY/pg_restore" --list > /dev/null

  production:
    name: Restore production's newest backup
    if: >-
      vars.BACKUP_S3_BUCKET != '' && (
        (github.event_name == 'schedule' && github.event.schedule == '41 3 * * 1') ||
        (github.event_name == 'workflow_dispatch' && inputs.production)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: backup-drill
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      LLM_PROVIDER: scripted
      RESTORE_CHECK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      BACKUP_S3_ENDPOINT_URL: ${{ vars.BACKUP_S3_ENDPOINT_URL }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'workshop/' }}
      # The drill's own key: get and list only.
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # The code production runs: its migrations are what the backup holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the Postgres 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-client-17

      - name: Install dependencies
        run: uv sync --frozen

      - name: workshop restore-check
        run: uv run python -m app.gateways.cli.restore_check --work-directory "$RUNNER_TEMP/drill"
