name: Payment page integrity

# Every Monday, the scripts of the pages that send a payer to a payment
# page (PAY-02; PCI DSS 11.6.1 intent and the script inventory of 6.4.3):
# the cabinet's billing page and the hosted chat page, which shows a
# deposit's payment link (web/src/lib/paymentPages.ts). Their scripts are
# first-party chunks of the build; web/payment-page-scripts.json lists each
# with its SHA-384, reviewed like code (web/scripts/payment-page-scripts.mjs).
#
# - With the repository variable PRODUCTION_CABINET_URL set: every listed
#   file as production serves it, against its reviewed hash.
# - Without it: the scripts of a fresh build of the default branch.
#
# A difference fails the run, and a scheduled failure opens the issue
# "Payment page scripts changed" (or comments on the open one). A deploy
# explains it only when the changed scripts come from reviewed commits:
# then the inventory is updated (docs/operations/ci.md, "Payment page
# integrity"); otherwise it is an incident (docs/operations/incident.md).
# No secret is used; the issue is written with the run's own token.
on:
  schedule:
    # 05:23 UTC every Monday.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-page-integrity
  cancel-in-progress: false

# Every `uses:` is pinned to a commit SHA (the comment names the release).
jobs:
  check:
    name: Payment pages' scripts against the reviewed inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PRODUCTION_CABINET_URL: ${{ vars.PRODUCTION_CABINET_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: env.PRODUCTION_CABINET_URL == ''
        run: npm ci --no-audit --no-fund

      - name: Build
        if: env.PRODUCTION_CABINET_URL == ''
        run: npm run build

      - name: Compare the scripts with the inventory
        run: |
          if [ -n "$PRODUCTION_CABINET_URL" ]; then
            source=(--origin "$PRODUCTION_CABINET_URL")
          else
            source=(--build .next --write "$RUNNER_TEMP/payment-page-scripts.json")
          fi
          status=0
          node scripts/payment-page-integrity.mjs --inventory payment-page-scripts.json \
            "${source[@]}" --report "$RUNNER_TEMP/report.md" || status=$?
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # The scripts this build found, for the review of a difference: once
      # reviewed, they replace web/payment-page-scripts.json.
      - name: Keep the scripts found
        if: failure() && env.PRODUCTION_CABINET_URL == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-page-scripts
          path: ${{ runner.temp }}/payment-page-scripts.json
          if-no-files-found: ignore
          retention-days: 30

  report:
    name: Open or update the issue
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # opens or comments on the issue
    steps:
      - name: One open issue while the scripts differ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Payment page scripts changed"
          number="$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still different: ${RUN_URL}"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<BODY
          The weekly check of the payment pages' scripts found a difference: ${RUN_URL}

          - [ ] Read the run summary: which page, which script, added, removed, changed or not served.
          - [ ] Match each change to a reviewed commit deployed since the inventory was updated. A change no commit explains is an incident (docs/operations/incident.md): roll back (docs/operations/deploys.md) and keep the served file.
          - [ ] Explained: update web/payment-page-scripts.json from the build of the commit production runs (docs/operations/ci.md, "Payment page integrity") in a reviewed pull request.
          - [ ] Close this issue with the run that passed again.
          BODY
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
