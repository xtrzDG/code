name: Evals nightly

# Every night and on demand: the evaluation datasets (evals/datasets) played
# against real models, the AI customer and the judge from the other model
# family, three samples per scenario (pass^3), compared with
# evals/baselines/<model>.json. The run fails when pass^k, or the pass rate
# of any deterministic criterion (language identity, memory, leaks, tool
# calls, ...), drops by more than 3 points, when pass^k is under 85% or
# when more than 2% of the samples hallucinate; summary.md becomes the job
# summary, and the report (JSON, HTML, Markdown) and the recorded cassettes
# are kept as an artifact. Without OPENAI_API_KEY and ANTHROPIC_API_KEY the benchmark is
# skipped with a notice. Pull requests replay the committed cassettes
# offline instead (tests/evals). evals/README.md explains both.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      niches:
        description: "Niches to play, space-separated (empty: every dataset)"
        type: string
        default: ""
      samples:
        description: "Samples per scenario (the k of pass^k)"
        type: number
        default: 3
      tolerance:
        description: "Allowed pass^k drop against the baseline (0.03 = 3 points)"
        type: string
        default: "0.03"
      criterion_tolerance:
        description: "Allowed drop of any criterion's pass rate (0.03 = 3 points)"
        type: string
        default: "0.03"
      min_pass_rate:
        description: "Fail below this pass^k, baseline or not (0.85 = 85%)"
        type: string
        default: "0.85"
      max_hallucination_rate:
        description: "Fail when more samples than this share hallucinated (0.02 = 2%)"
        type: string
        default: "0.02"
      update_baseline:
        description: "Store this run as the model's baseline (artifact; commit it in a PR)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-nightly
  cancel-in-progress: false

# Every `uses:` is pinned to a commit SHA (the comment names the release).
jobs:
  live:
    name: Live benchmark (${{ matrix.model }}, judged by ${{ matrix.judge }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned model versions, never floating aliases (AI-12,
          # app/utilities/conversations/llm_model_pins.py).
          - model: gpt-5-mini-2025-08-07
            judge: claude-opus-5-5
          - model: claude-opus-5-5
            judge: gpt-5-mini-2025-08-07
    # The provider keys reach only the two steps that need them.
    env:
      UV_FROZEN: "1"
      NICHES: ${{ inputs.niches || '' }}
      SAMPLES: ${{ inputs.samples || 3 }}
      TOLERANCE: ${{ inputs.tolerance || '0.03' }}
      CRITERION_TOLERANCE: ${{ inputs.criterion_tolerance || '0.03' }}
      MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.85' }}
      MAX_HALLUCINATION_RATE: ${{ inputs.max_hallucination_rate || '0.02' }}
      UPDATE_BASELINE: ${{ inputs.update_baseline && '--update-baseline' || '' }}
      MODEL: ${{ matrix.model }}
      JUDGE: ${{ matrix.judge }}
    steps:
      - name: Provider keys
        id: keys
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY and ANTHROPIC_API_KEY are not both set; the live benchmark is skipped (evals/README.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.keys.outputs.enabled == 'true' }}
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        if: ${{ steps.keys.outputs.enabled == 'true' }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: ${{ steps.keys.outputs.enabled == 'true' }}
        run: uv sync --frozen

      # Exit code 1: pass^k or a criterion's pass rate fell by more than its
      # tolerance (only scenarios both runs played are compared), pass^k is
      # under the floor, or the hallucination rate is over the ceiling; the
      # floor and the ceiling hold before a model has a baseline too.
      - name: Play the datasets and compare with the baseline
        if: ${{ steps.keys.outputs.enabled == 'true' }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          niche_arguments=()
          for niche in $NICHES; do niche_arguments+=(--niche "$niche"); done
          mkdir -p "reports/evals/$MODEL"
          set +e
          uv run python -m scripts.run_evals --record \
            --model "$MODEL" --judge-model "$JUDGE" \
            --samples "$SAMPLES" --tolerance "$TOLERANCE" \
            --criterion-tolerance "$CRITERION_TOLERANCE" --workers 8 \
            --min-pass-rate "$MIN_PASS_RATE" --max-hallucination-rate "$MAX_HALLUCINATION_RATE" \
            --cassettes "reports/evals/$MODEL/cassettes" --out "reports/evals/$MODEL" \
            "${niche_arguments[@]}" ${UPDATE_BASELINE:+"$UPDATE_BASELINE"} 2>&1 | tee "reports/evals/$MODEL/run.log"
          status=${PIPESTATUS[0]}
          if [ -f "reports/evals/$MODEL/summary.md" ]; then
            cat "reports/evals/$MODEL/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 6 "reports/evals/$MODEL/run.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Keep the report, the cassettes and the baseline
        if: ${{ always() && steps.keys.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.model }}
          path: |
            reports/evals/${{ matrix.model }}
            evals/baselines/${{ matrix.model }}.json
          if-no-files-found: ignore
          retention-days: 30
