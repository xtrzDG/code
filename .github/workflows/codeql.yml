name: CodeQL

# Semantic security analysis of the backend (Python) and of the cabinet and
# widget (JavaScript/TypeScript). Alerts appear under Security > Code
# scanning; a pull request that adds a high-severity alert fails its check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new queries also run on code nobody touched.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              # Flitt's API prescribes SHA-1 signatures; this one-function
              # module is the only use (see its docstring).
              - app/clients/flitt/flitt_signature_digest.py
              - tests
              - web/e2e
              - web/src/**/*.test.ts
              - web/src/api/schema.d.ts
              - "**/*.generated.ts"

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
