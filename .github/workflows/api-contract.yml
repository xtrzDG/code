name: API contract

# Changes within /v1 are additive only (docs/api-versioning.md). This check
# compares web/openapi.json with its state at the merge base and fails on
# breaking changes. A deliberate break (agreed with every client, recorded
# in docs/API_CHANGELOG.md) is let through by the `api-breaking` label; the
# label events re-run this workflow alone.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  OASDIFF_VERSION: "1.33.0"
  OASDIFF_SHA256: "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247"

jobs:
  breaking-changes:
    name: OpenAPI breaking changes (oasdiff)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'api-breaking') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install oasdiff
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" oasdiff

      - name: API description at the merge base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
          if git cat-file -e "$merge_base:web/openapi.json" 2>/dev/null; then
            git show "$merge_base:web/openapi.json" > "$RUNNER_TEMP/base-openapi.json"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "The merge base has no web/openapi.json; nothing to compare."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changes (job summary)
        if: steps.base.outputs.found == 'true'
        run: |
          {
            echo "### API changes against the merge base"
            echo '```'
            "$RUNNER_TEMP/oasdiff" changelog "$RUNNER_TEMP/base-openapi.json" web/openapi.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No breaking changes
        if: steps.base.outputs.found == 'true'
        run: |
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/base-openapi.json" web/openapi.json --fail-on ERR \
            || { echo "::error::Breaking API change. Make it additive (docs/api-versioning.md) or, if agreed, label the pull request api-breaking and record it in docs/API_CHANGELOG.md."; exit 1; }
