name: Zapier app

# The Zapier app scaffold (integrations/zapier): its tests run with Node's
# own test runner against a stand-in for Zapier, without network and
# without installing dependencies. Publishing is manual (README there).
on:
  pull_request:
    paths:
      - "integrations/zapier/**"
      - ".github/workflows/zapier.yml"
  push:
    branches: [main]
    paths:
      - "integrations/zapier/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zapier-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a commit SHA (the comment names the release).
jobs:
  test:
    name: Zapier app tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run the tests
        run: npm test
