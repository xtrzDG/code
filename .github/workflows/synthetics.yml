name: Synthetic checks (production)

# Every hour, production as its customers meet it, at PRODUCTION_URL:
#
# - health: /healthz, /readyz (database, migrations), the widget script and
#   the sign-in options, plus the cabinet's sign-in page and security.txt
#   when PRODUCTION_CABINET_URL is set (scripts/smoke.sh);
# - a chat round trip through the website widget of the monitoring business
#   (MONITORING_BUSINESS_ID): a visitor's message and the assistant's
#   answer, which proves the worker and the model answer (one answer a run);
# - a booking created and cancelled again through the public API with the
#   monitoring business's API key (scripts/synthetic_booking.py).
#
# A failed scheduled run opens the issue "Production synthetic check
# failed" or comments on the open one (docs/operations/incident.md decides
# what follows). Setup: repository variables PRODUCTION_URL (the production
# API's https address, as PRODUCTION_API_URL), MONITORING_BUSINESS_ID (a
# live business kept for these checks, open for a booking for one at 12:00
# every day) and optionally PRODUCTION_CABINET_URL; the secret
# MONITORING_API_KEY (an API key of that business with bookings:write). A
# run without them fails and names what is missing: a check that skips
# itself proves nothing.
on:
  schedule:
    # Minute 41 of every hour.
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetics
  cancel-in-progress: false

# Every `uses:` is pinned to a commit SHA (the comment names the release).
jobs:
  check:
    name: Production synthetic checks (health, widget chat, booking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Production is configured for the checks
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          MONITORING_BUSINESS_ID: ${{ vars.MONITORING_BUSINESS_ID }}
          KEY_IS_SET: ${{ secrets.MONITORING_API_KEY != '' }}
        run: |
          missing=""
          [ -n "$PRODUCTION_URL" ] || missing="${missing} the variable PRODUCTION_URL,"
          [ -n "$MONITORING_BUSINESS_ID" ] || missing="${missing} the variable MONITORING_BUSINESS_ID,"
          [ "$KEY_IS_SET" = "true" ] || missing="${missing} the secret MONITORING_API_KEY,"
          if [ -n "$missing" ]; then
            echo "::error::Production's synthetic checks are not set up: set${missing%,} (.github/workflows/synthetics.yml)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Health and a widget chat
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PRODUCTION_CABINET_URL: ${{ vars.PRODUCTION_CABINET_URL }}
          SMOKE_WIDGET_BUSINESS_ID: ${{ vars.MONITORING_BUSINESS_ID }}
          SMOKE_WAIT_SECONDS: "30"
        run: scripts/smoke.sh "$PRODUCTION_URL" ${PRODUCTION_CABINET_URL:+"$PRODUCTION_CABINET_URL"}

      - name: A booking created and cancelled
        if: ${{ !cancelled() }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          MONITORING_API_KEY: ${{ secrets.MONITORING_API_KEY }}
        run: uv run --no-project python -m scripts.synthetic_booking "$PRODUCTION_URL"

  report:
    name: Open or update the issue
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write # opens or comments on the failure issue
    steps:
      - name: One open issue while production fails its checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Production synthetic check failed"
          number="$(gh issue list --state open --search "in:title \"${title}\"" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: ${RUN_URL}"
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<BODY
          A scheduled synthetic check of production failed: ${RUN_URL}

          - [ ] Read the failed step: health, the widget chat or the booking round trip.
          - [ ] A real outage: follow docs/operations/incident.md (status page, rollback in docs/operations/deploys.md).
          - [ ] A booking left behind is named in the log: cancel it in the monitoring business's cabinet.
          - [ ] Close this issue with the run that passed again.
          BODY
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
