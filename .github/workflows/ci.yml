name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `uses:` is pinned to a commit SHA (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes updates weekly. Downloaded
# tools are pinned by version and checked against their SHA-256.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  backend:
    name: Backend (ruff, mypy, pyright, pytest with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The storage tests start a throwaway Postgres 16 from these binaries
      # (tests/storage/postgres_server.py); they are skipped without them, so
      # the job checks they are present.
      POSTGRES_BIN_DIRECTORY: /usr/lib/postgresql/16/bin
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install PostgreSQL 16 binaries
        run: |
          if [ ! -x "$POSTGRES_BIN_DIRECTORY/initdb" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-16
          fi
          "$POSTGRES_BIN_DIRECTORY/postgres" --version

      # Backups must open with the age tool (tests/backups/test_age_cli_interop.py).
      - name: Install age
        run: |
          if ! command -v age > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends age
          fi
          age --version

      # The invoice and receipt PDFs (WeasyPrint) lay text out with Pango.
      - name: Install the PDF engine's libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Type check (pyright)
        run: uv run pyright

      # Counts the fields in square brackets of the legal texts in force;
      # fails only once the repository variable LEGAL_TEXTS_FINAL says the
      # lawyer-reviewed texts are final (docs/legal/README.md).
      - name: Legal texts (fields to fill in)
        env:
          LEGAL_TEXTS_FINAL: ${{ vars.LEGAL_TEXTS_FINAL || 'false' }}
        run: uv run python -m scripts.check_legal_texts

      # In parallel (pytest-xdist) with line and branch coverage of app/,
      # which may not fall below 95 % ([tool.coverage] in pyproject.toml).
      # Includes the architecture policies: role layers (.importlinter),
      # dead code (vulture), at most 300 lines per file in app/, scripts/,
      # tests/ and web/src/, typed domain primitives, the API changelog.
      - name: Tests with coverage
        run: >-
          uv run pytest -ra -n auto
          --cov=app --cov-branch --cov-fail-under=95
          --cov-report=term:skip-covered

  web:
    name: Cabinet (lint, typecheck, test with coverage, generated client, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Georgian and Russian dates, plurals and lists need Node with full ICU.
      - name: Node formats Georgian, Russian and English (full ICU)
        run: npm run check:intl

      # Includes max-lines: at most 300 lines per file in src/ and e2e/.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Coverage floors of src/lib and the routes' _lib (vitest.config.mts).
      - name: Tests with coverage
        run: npm run test:coverage

      # The typed client must be generated from the committed openapi.json
      # (which the backend tests compare with the API itself).
      - name: Generated API client is current
        run: |
          npm run gen:api:types
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::Run 'cd web && npm run gen:api' and commit src/api/schema.d.ts."; exit 1; }

      - name: Build
        run: npm run build

  security:
    name: Security (dependencies, secrets, static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the whole history, not only the last commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Known vulnerabilities in the locked Python dependencies (PyPI and
      # OSV advisories); --strict fails when a package cannot be audited.
      - name: Python dependencies (pip-audit)
        run: >-
          uv export --frozen --no-emit-project --format requirements-txt
          | uvx "pip-audit==${PIP_AUDIT_VERSION}" --strict --disable-pip
          --requirement /dev/stdin

      # Runtime dependencies of the cabinet; dev tools never reach users.
      - name: Cabinet dependencies (npm audit)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - name: Secrets in the whole history (gitleaks)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .

      # Static analysis of the backend; bandit-baseline.json holds the
      # findings reviewed on its date (SECURITY.md), new ones fail.
      - name: Python static analysis (bandit)
        run: uv run --frozen --only-group dev bandit -c pyproject.toml -r app scripts -b bandit-baseline.json

  images:
    name: Docker images (build, smoke test, Trivy, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build the backend image
        run: docker build --tag assistant-workshop-backend:ci .

      - name: Build the cabinet image
        run: docker build --tag assistant-workshop-web:ci web

      - name: Smoke test the backend image
        run: |
          # Without DATABASE_URL the migration and backfill runners refuse with exit code 2.
          for runner in migrate migrate-documents backfill-lookup; do
            status=0
            docker run --rm assistant-workshop-backend:ci "$runner" --dry-run || status=$?
            test "$status" -eq 2
          done
          docker run --detach --name api --publish 8000:8000 \
            --env APP_ENV=development --env LLM_PROVIDER=scripted \
            assistant-workshop-backend:ci api
          # The checks that run after every deploy (docs/operations/deploys.md).
          if ! SMOKE_WAIT_SECONDS=30 scripts/smoke.sh http://127.0.0.1:8000; then
            docker logs api
            exit 1
          fi
          docker rm --force api
          # The image lays out a Georgian invoice PDF with its own fonts.
          docker run --rm --entrypoint python assistant-workshop-backend:ci -c \
            "from weasyprint import HTML; assert HTML(string='<p>ინვოისი Счёт</p>').write_pdf().startswith(b'%PDF')"
          docker run --rm --entrypoint fc-list assistant-workshop-backend:ci \
            ':lang=ka' family | grep -q 'Noto Sans Georgian'

      # Fails on HIGH and CRITICAL vulnerabilities that have a fix; reviewed
      # exceptions go to .trivyignore with a reason and an expiry date.
      - name: Scan the backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: assistant-workshop-backend:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Scan the cabinet image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: assistant-workshop-web:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: SBOM of the backend image (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: assistant-workshop-backend:ci
          format: spdx-json
          artifact-name: sbom-backend.spdx.json
          upload-artifact-retention: 30

      - name: SBOM of the cabinet image (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: assistant-workshop-web:ci
          format: spdx-json
          artifact-name: sbom-web.spdx.json
          upload-artifact-retention: 30

  e2e:
    name: End-to-end (Playwright, API + cabinet)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The invoice and receipt downloads render PDFs (WeasyPrint, Pango).
      - name: Install the PDF engine's libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install API dependencies
        working-directory: .
        run: uv sync --frozen

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install cabinet dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Builds the cabinet, starts it and the API (in-memory, development
      # login codes) and runs e2e/*.spec.ts; see e2e/playwright.config.ts.
      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the report, traces and API log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            web/e2e/.artifacts/report
            web/e2e/.artifacts/results
            web/e2e/.artifacts/api.log
          if-no-files-found: ignore
          retention-days: 7
