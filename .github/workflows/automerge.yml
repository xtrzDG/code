name: Dependabot automerge

# Merges a Dependabot pull request once CI has passed on it, when it is a
# group (.github/dependabot.yml) and every update in it is a patch or a
# minor (scripts/dependabot_automerge.py reads Dependabot's commit
# metadata). Majors, single updates and security fixes outside a group wait
# for a person. This runs from the default branch: no code of the pull
# request is checked out or run, and the merge names the exact head commit
# CI passed on, so a later push to the branch stops it.
#
# Branch protection requires checks of three workflows (CI, CodeQL, API
# contract; .github/repository-settings.json), which finish in any order: the
# job runs after each of them and merges only once no required check of the
# head is pending, so the last one to finish merges. After the merge it
# starts every workflow a push to main would have started, since a merge
# made with this job's token pushes no event: CI (whose run on main
# publishes the signed images deploy smoke verifies), CodeQL, Lighthouse
# and the ZAP baseline, all checks Render's checksPass waits for.
on:
  workflow_run:
    workflows: [CI, CodeQL, API contract]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge a green grouped patch or minor update
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # actions: write starts the push workflows of the base branch after
      # the merge.
      actions: write
      # checks and statuses: read tell which required checks are pending.
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"

      - name: Merge when every update of the group is a patch or a minor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[] | select(.state == "open" and .user.login == "dependabot[bot]") | "\(.number) \(.head.sha)"' \
            | awk -v sha="$HEAD_SHA" '$2 == sha { print $1; exit }')"
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request has ${HEAD_SHA} as its head: nothing to merge."
            exit 0
          fi
          author="$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" --jq '.author.login // ""')"
          if [ "$author" != "dependabot[bot]" ]; then
            echo "The head commit of #${pr} is not Dependabot's (${author}): left for review."
            exit 0
          fi
          # A group that conflicts with the branch is not a failure of this
          # job: Dependabot rebases it, CI runs again and so does this job.
          mergeable="$(gh pr view "$pr" --json mergeable --jq '.mergeable')"
          if [ "$mergeable" = "CONFLICTING" ]; then
            echo "::notice::#${pr} conflicts with its base: left for Dependabot's rebase."
            exit 0
          fi
          # A required check of another workflow still running: that
          # workflow's completion runs this job again, and it merges then.
          if pending="$(gh pr checks "$pr" --required --json bucket \
              --jq '[.[] | select(.bucket == "pending")] | length')" \
              && [ "${pending:-0}" -gt 0 ]; then
            echo "::notice::#${pr} waits for ${pending} required check(s): the last workflow to finish merges it."
            exit 0
          fi
          if gh api "repos/${GH_REPO}/commits/${HEAD_SHA}" --jq '.commit.message' \
              | uv run --no-project python -m scripts.dependabot_automerge; then
            base="$(gh pr view "$pr" --json baseRefName --jq '.baseRefName')"
            if ! gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA"; then
              # GitHub can lose the answer to a merge it made (a 502): the
              # merge went through when the base's head is this pull
              # request's squash commit, and that head needs CI as well.
              sleep 15
              subject="$(gh api "repos/${GH_REPO}/commits/${base}" --jq '.commit.message | split("\n")[0]')"
              case "$subject" in
                *"(#${pr})") echo "::warning::The merge of #${pr} answered with an error but went through." ;;
                *) exit 1 ;;
              esac
            fi
            # A merge made with this job's token starts no workflow on the
            # base branch, so its new head would carry no CI, no signed
            # images and no scan: ask for every push workflow of main.
            for name in ci.yml codeql.yml lighthouse.yml zap.yml; do
              gh workflow run "$name" --ref "$base"
            done
          fi
