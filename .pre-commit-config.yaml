# Fast checks on staged files before each commit (`just setup` installs the
# hook; run all with `uvx pre-commit run --all-files`). CI runs the full set
# (`just check`), so a hook skipped with --no-verify is still caught there.
# Hook repositories are frozen to a commit (`pre-commit autoupdate --freeze`).
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^web/tsconfig\.json$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: eslint
        name: eslint (cabinet)
        entry: bash -c 'cd web && npx eslint --max-warnings=0 --no-warn-ignored "${@#web/}"' --
        language: system
        files: ^web/(src|e2e)/.*\.(ts|tsx|mts)$
        require_serial: true
      - id: file-size
        name: at most 300 lines per source file
        entry: uv run pytest -q -p no:cacheprovider tests/architecture_policy/test_source_file_size.py
        language: system
        files: \.(py|ts|tsx|mts|css|js|html)$
        pass_filenames: false
      - id: api-description
        name: API description and typed client are current
        entry: bash -c 'uv run pytest -q -p no:cacheprovider tests/platform/test_openapi_export.py tests/platform/test_api_changelog.py'
        language: system
        files: ^(app/gateways/|app/schemas/dto/|web/openapi\.json|docs/API_CHANGELOG\.md)
        pass_filenames: false
