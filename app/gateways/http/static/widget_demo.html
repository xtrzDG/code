<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Website chat demo — Assistant Workshop</title>
<style>
  :root { color-scheme: light dark; --ink: #111827; --muted: #4b5563; --line: #e5e7eb;
    --canvas: #f8fafc; --surface: #ffffff; --code: #f1f5f9; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f9fafb; --muted: #9ca3af; --line: #374151; --canvas: #0b1120;
      --surface: #111827; --code: #1f2937; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 140px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-top: 24px; }
  h2 { font-size: 18px; margin: 0 0 8px; }
  pre { background: var(--code); border-radius: 10px; padding: 14px; overflow-x: auto;
    font-size: 13.5px; margin: 0; white-space: pre-wrap; word-break: break-all; }
  ul { margin: 0; padding-inline-start: 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; background: var(--surface); color: inherit; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 10px;
    background: #4f46e5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  code { font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Website chat demo</h1>
  <p>This page shows the chat widget exactly as visitors see it on a business website.
    The widget picks the visitor's language from the browser among the business languages.</p>
${content}
</main>
${widget}
</body>
</html>
