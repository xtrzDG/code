[project]
name = "assistant-workshop"
version = "0.1.0"
description = "AI front-line assistant platform: questionnaire-driven assembly, multi-channel conversations, bookings and human handoff for businesses in any country."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "base-pydantic-schemas",
    "base-typed-id",
    "base-typed-int>=0.2.0",
    "base-typed-float",
    "base-typed-string>=0.2.0",
    "dependency-injector",
    "typed-time-provider",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "phonenumbers>=9.0.40",
    "babel>=2.18.0",
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.71.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "import-linter>=2.15",
    "mypy",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "ruff",
    "vulture>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    "venv",
    "node_modules",
    "**/__pycache__",
    "dist",
    "build",
    ".dev_tools",
]
