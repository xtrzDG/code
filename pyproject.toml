[project]
name = "assistant-workshop"
version = "0.1.0"
description = "AI front-line assistant platform: questionnaire-driven assembly, multi-channel conversations, bookings and human handoff for businesses in any country."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "base-pydantic-schemas",
    "base-typed-id",
    "base-typed-int>=0.2.0",
    "base-typed-float",
    "base-typed-string>=0.2.0",
    "dependency-injector",
    "typed-time-provider",
    "fastapi>=0.142.2",
    # Tolerant reads of stored documents use model_validate_json(extra=...).
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
    "phonenumbers>=9.0.40",
    "babel>=2.18.0",
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "sentry-sdk>=2.71.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "flask>=3.1",
    "flask-cors>=6.0",
    "import-linter>=2.15",
    "moto[s3]>=5.1",
    "mypy",
    "pyright",
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
    "ruff",
    "vulture>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Each line names an attribute so vulture counts it as used.
"vulture_whitelist.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI: `uv run pytest -n auto --cov=app --cov-branch --cov-fail-under=95`.
# The floor is line and branch coverage of app/ together; lower it never,
# raise it when the suite allows.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true
exclude_also = [
    # Bodies of Protocol contracts: implementations are tested instead.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = [
    "vulture_whitelist.py",
    ".venv",
    "venv",
    "node_modules",
    "**/__pycache__",
    "dist",
    "build",
    ".dev_tools",
]

# Dead code: `uv run vulture` (CI runs it through
# tests/architecture_policy/test_dead_code.py). Framework entry points are
# recognised by decorator or name; everything else that looks unused but is
# used from outside Python (serialized fields, enum values read by the
# cabinet) is listed in vulture_whitelist.py with the reason.
[tool.vulture]
paths = ["app", "scripts", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = false
ignore_decorators = [
    "@router.*",
    "@http_application.*",
    "@model_validator",
    "@field_validator",
]
ignore_names = [
    # Value constraints of constrained primitives, read by their base class.
    "min_length",
    "max_length",
    "pattern",
    "gt",
    "ge",
    "lt",
    "le",
    "multiple_of",
    "uuid_version",
    # html.parser.HTMLParser callbacks.
    "handle_starttag",
    "handle_endtag",
    "handle_data",
]

# Static security scan: `uv run bandit -c pyproject.toml -r app scripts -b
# bandit-baseline.json`. The baseline holds the findings reviewed on its
# date (generated_at) and accepted as false positives (SECURITY.md lists
# them); any new finding fails CI.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "web"]
