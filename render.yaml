      - key: SENTRY_DSN
        fromService:
          type: web
          name: workshop-api
          envVarKey: SENTRY_DSN

  - type: web
    name: workshop-cabinet
    runtime: docker
    region: frankfurt
    plan: starter
    branch: release
    autoDeployTrigger: checksPass
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /login
    buildFilter:
      paths:
        - web/**
    envVars:
      # The API as the cabinet's server reaches it: its internal address from
      # the dashboard (workshop-api -> Connect -> Internal), with http:// and
      # port 8000, e.g. http://workshop-api:8000. Never the public https
      # address: those requests leave through Render's egress, so the API
      # sees one egress IP for every owner (audit log, OTP_SENDS_PER_IP_PER_HOUR).
      - key: BACKEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Render's edge appends one X-Forwarded-For hop in front of the cabinet:
      # only that right-most entry is forwarded to the API.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # errors of the cabinet (server and browser); empty: none are sent
      - key: SENTRY_DSN
        sync: false
