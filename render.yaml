      - key: ZADARMA_API_SECRET
        fromService:
          type: web
          name: workshop-api
          envVarKey: ZADARMA_API_SECRET
      - key: META_APP_ID
        fromService:
          type: web
          name: workshop-api
          envVarKey: META_APP_ID
      - key: META_APP_SECRET
        fromService:
          type: web
          name: workshop-api
          envVarKey: META_APP_SECRET
      - key: META_VERIFY_TOKEN
        fromService:
          type: web
          name: workshop-api
          envVarKey: META_VERIFY_TOKEN
      - key: WHATSAPP_SYSTEM_USER_TOKEN
        fromService:
          type: web
          name: workshop-api
