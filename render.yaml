  - type: web
    name: workshop-cabinet
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /login
    buildFilter:
      paths:
        - web/**
    envVars:
      # The API as the cabinet's server reaches it: its internal address from
      # the dashboard (workshop-api -> Connect -> Internal), with http:// and
      # port 8000, e.g. http://workshop-api:8000; or its public https address.
      - key: BACKEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
