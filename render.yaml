      - key: WHATSAPP_NOTIFICATION_TEMPLATE
        fromService:
          type: web
          name: workshop-api
          envVarKey: WHATSAPP_NOTIFICATION_TEMPLATE
      - key: TELEGRAM_PLATFORM_BOT_TOKEN
        fromService:
