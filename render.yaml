# Render Blueprint (https://render.com/docs/blueprint-spec): everything in
# Frankfurt (EU), as the concept requires for personal data.
#
#   workshop-db       managed Postgres 16, reachable only inside Render
#   workshop-api      the API (Docker image of ./Dockerfile); migrations run
#                     before every deploy (`workshop migrate`)
#   workshop-worker   the background worker (same image)
#   workshop-cabinet  the owner cabinet (./web/Dockerfile)
#
# Secrets are `sync: false`: the dashboard asks for them when the Blueprint is
# created (leave unused ones empty) and never overwrites them later. The
# worker copies exactly the API keys listed below (fromService copies one
# named key, not the whole service). Any other variable (LLM_MODEL_ID,
# OPENAI_BASE_URL, LANGFUSE_HOST, RECORDING_RETENTION_DAYS,
# WORKER_POLL_SECONDS, ...) goes into the env group workshop-backend, which
# both services read. ENCRYPTION_KEY is generated once and shared; never
# change it, or stored channel credentials become unreadable.
#
# The image's ENTRYPOINT is `workshop`; the commands below also name it, so
# they work whether a platform keeps the ENTRYPOINT or replaces it.
#
# Deploys (docs/operations/deploys.md): every service follows the `release`
# branch and deploys a commit only after all its GitHub checks passed
# (`autoDeployTrigger: checksPass`), so API, worker and cabinet always run
# one commit. `release` moves forward only to commits that passed the
# staging smoke test (render.staging.yaml, .github/workflows/deploy-smoke.yml)
# or by hand: `git push origin <commit>:release` (create it once before the
# Blueprint: `git push origin main:release`).

databases:
  - name: workshop-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: workshop
    user: workshop
    # No public access: only services of this account in the region connect.
    ipAllowList: []

envVarGroups:
  - name: workshop-backend
    envVars:
      - key: APP_ENV
        value: production
      - key: ENCRYPTION_KEY
        generateValue: true
      # Render's proxies and the cabinet (private network) set X-Forwarded-For;
      # the audit log keeps client IPs. Only these hops are trusted, so uvicorn
      # reads the header from the right and a forged left-most entry is ignored
      # (never "*": that takes the left-most entry the client controls).
      - key: FORWARDED_ALLOW_IPS
        value: "10.0.0.0/8"
      - key: DEFAULT_DATA_REGION
        value: eu

services:
  - type: web
    name: workshop-api
    runtime: docker
    region: frankfurt
    plan: starter
    branch: release
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: workshop api
    preDeployCommand: workshop migrate
    # Two instances: a deploy or a crashed instance never takes the API down.
    # Locks (bookings, a customer's turns, login code sends) are Postgres
    # advisory locks and the rate limits are counted in Postgres, so both
    # instances share them (docs/LAUNCH.md, "Несколько экземпляров API").
    numInstances: 2
    # Readiness: the database answers, every migration of this build is
    # applied and a connection is free (GET /healthz is liveness only).
    healthCheckPath: /readyz
    # SIGTERM first: uvicorn finishes open requests (25 s), then exits.
    maxShutdownDelaySeconds: 30
    # docs/** is ignored, so a new DPA text in docs/legal is built into the
    # image only by a rebuild: set DPA_DOCUMENT_VERSION with
    # "Save, rebuild, and deploy" or use Manual Deploy -> "Deploy latest commit"
    # ("Save and deploy" reuses the old build, without the new text).
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - "**/*.md"
    envVars:
      - fromGroup: workshop-backend
      - key: PORT
        value: "8000"
      # Connections: 2 instances x 30 + the worker's 20 stay below the 100 of
      # basic-256mb (a thread holds one connection at most, so the pool
      # matches the request threads). Half the threads may wait for the model.
      - key: THREADPOOL_SIZE
        value: "30"
      - key: DB_POOL_SIZE
        value: "30"
      - key: LLM_MAX_CONCURRENCY
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-db
          property: connectionString
      # public https address of this API, e.g. https://workshop-api.onrender.com (webhooks, widget)
      - key: APP_BASE_URL
        sync: false
      # public https address of the cabinet, e.g. https://workshop-cabinet.onrender.com
      # (Google Calendar and the payment page send owners back there)
      - key: CABINET_BASE_URL
        sync: false
      # public https origin of the cabinet, e.g. https://workshop-cabinet.onrender.com
      # (cabinet CORS; the payment page returns payers there)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: PLATFORM_ADMIN_PHONE_NUMBERS
        sync: false
      # openai (default: gpt-5-mini in an EU data-residency project) or anthropic
      - key: LLM_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # login codes by SMS
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # login codes by Telegram
      - key: TELEGRAM_GATEWAY_API_TOKEN
        sync: false
      # login codes by WhatsApp
      - key: WHATSAPP_OTP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE_LANGUAGES
        sync: false
      # login codes by e-mail
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURITY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # bot check of risky login code requests (Cloudflare Turnstile)
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # phone ranges that never get a login code (E.164 starts)
      - key: OTP_DENIED_PHONE_PREFIXES
        sync: false
      # voice
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: ZADARMA_API_KEY
        sync: false
      - key: ZADARMA_API_SECRET
        sync: false
      # call recordings: s3 = encrypted in an EU bucket (docs/LAUNCH.md 4.6);
      # empty: they stay with ElevenLabs
      - key: RECORDINGS_STORAGE
        sync: false
      - key: RECORDINGS_S3_ENDPOINT_URL
        sync: false
      - key: RECORDINGS_S3_REGION
        sync: false
      - key: RECORDINGS_S3_BUCKET
        sync: false
      - key: RECORDINGS_S3_ACCESS_KEY_ID
        sync: false
      - key: RECORDINGS_S3_SECRET_ACCESS_KEY
        sync: false
      # WhatsApp, Instagram, Messenger
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_SYSTEM_USER_TOKEN
        sync: false
      - key: WHATSAPP_NOTIFICATION_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_NOTIFICATION_TEMPLATE
        sync: false
      # booking reminders after the customer's 24-hour WhatsApp window
      - key: WHATSAPP_REMINDER_TEMPLATE
        sync: false
      - key: TELEGRAM_PLATFORM_BOT_TOKEN
        sync: false
      # staff notifications on cabinet devices (Web Push, VAPID)
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
      # Google Calendar
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # payments
      - key: FLITT_MERCHANT_ID
        sync: false
      - key: FLITT_SECRET_KEY
        sync: false
      # observability
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: workshop-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: release
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: workshop worker
    # Running jobs get 25 s after SIGTERM; a cut-off job runs again on
    # another worker once its lease ends.
    maxShutdownDelaySeconds: 60
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - "**/*.md"
    envVars:
      - fromGroup: workshop-backend
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-db
          property: connectionString
      # The worker's lanes run 16 jobs at once (WORKER_LANE_CONCURRENCY), plus
      # its scheduler: 20 connections; it serves no requests.
      - key: THREADPOOL_SIZE
        value: "20"
      - key: DB_POOL_SIZE
        value: "20"
      - key: LLM_MAX_CONCURRENCY
        value: "12"
      - key: APP_BASE_URL
        fromService:
          type: web
          name: workshop-api
          envVarKey: APP_BASE_URL
      - key: CABINET_BASE_URL
        fromService:
          type: web
          name: workshop-api
          envVarKey: CABINET_BASE_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: workshop-api
