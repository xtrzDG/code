# Customer-side flows (a booking to cancel, move or look up, a returning
# customer, a voice note, a photo), attacks, and more languages.
- id: cancel__ka
  language: ka
  kind: cancellation
  channel: whatsapp
  persona: {name: ნინო, phone: '+995555100201'}
  setup:
    booking: {date: '2026-10-08', time: '18:00', party_size: 1}
  goal: You have a booking on Thursday, 8 October at 18:00. Ask to cancel it, and confirm when the assistant asks.
  customer: ['გამარჯობა! ხუთშაბათს ვერ მოვდივარ. გთხოვთ, გააუქმეთ ჩემი ჯავშანი.', 'დიახ, გააუქმეთ.']
  assistant:
  - call:
      list_my_bookings: {}
  - {say: 'ხუთშაბათს, 8 ოქტომბერს, 18:00-ზე გაქვთ ჯავშანი. გავაუქმო?'}
  - call:
