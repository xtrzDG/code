# Evaluation dataset of the clinic niche: Vake Family Clinic in ka, ru, en, he, ar.
# Eight scenarios per language. `customer` and `assistant` are the reference
# conversation the scripted model plays (the seeded cassettes); a live model
# improvises from the persona and goal and is scored by `expect`
# (evals/README.md describes every field).
niche: clinic
business:
  name: Vake Family Clinic
  languages: [ka, ru, en, he, ar]
  prices: {consultation: '80', follow_up_visit: '50', blood_test: '35'}
  answers: {insurance: 'Yes, we work with Aldagi, GPI and Imedi L insurance.', test_results: Results come by e-mail within 2 working days.}
scenarios:
- id: price__ka
  language: ka
  kind: price_question
  item: Doctor's consultation
  persona: {name: ნინო, phone: '+995555100201'}
  customer: ['გამარჯობა! რა ღირს ექიმის კონსულტაცია?']
  assistant:
  - call:
      get_price: {item_name: Doctor's consultation}
  - {say: 'ექიმის კონსულტაცია ღირს 80 ლარი. კიდევ რამით შემიძლია დაგეხმაროთ?'}
  expect:
    prices: ['80']
    handoff: false
- id: booking__ka
  language: ka
  kind: booking
  persona: {name: ნინო, phone: '+995555100201'}
  goal: Book a doctor's consultation on Thursday at 12:00. Give your name and phone number, and confirm when the assistant repeats the details.
  customer: ['გამარჯობა! მინდა დავჯავშნო: ექიმის კონსულტაცია, ხუთშაბათს 12:00-ზე. მე ვარ ნინო, ტელეფონი +995 555 10 02 01.', 'დიახ, დაჯავშნეთ.']
  assistant:
  - call:
      check_availability: {date: '2026-10-08', time: '12:00', party_size: 1, nights: null, resource_type: null, duration_minutes: null}
  - {say: 'ხუთშაბათს 12:00-ზე თავისუფალია. დავჯავშნო სახელზე ნინო?'}
  - call:
      create_booking: {name: ნინო, phone: '+995555100201', resource_type: null, date: '2026-10-08', time: '12:00', party_size: 1, duration_minutes: null, nights: null, notes: null}
  - {say: 'მზადაა, ნინო! ჯავშანი გაფორმდა ხუთშაბათს, 12:00-ზე. გელოდებით!'}
  expect:
    tools:
    - check_availability
    - create_booking:
        name: [ნინო, Nino]
        phone: '+995555100201'
        party_size: 1
        date: '2026-10-08'
        time: '12:00'
    handoff: false
- id: closed__ka
  language: ka
  kind: booking_out_of_hours
  persona: {name: ნინო, phone: '+995555100201'}
  goal: Ask to book a doctor's consultation on Thursday at 07:00, when the business is still closed. Accept another time only if the assistant offers one within the opening hours.
  customer: ['შეიძლება დავჯავშნო ექიმის კონსულტაცია ხუთშაბათს 07:00-ზე?']
  assistant:
  - call:
      check_availability: {date: '2026-10-08', time: '07:00', party_size: 1, nights: null, resource_type: null, duration_minutes: null}
  - {say: '07:00-ზე ჯერ დაკეტილი ვართ: ხუთშაბათს 09:00-ზე ვიხსნებით. პირველი თავისუფალი დროა 09:00. დავჯავშნო?'}
  expect:
    forbidden_tools: [create_booking]
    facts: ['09:00']
    handoff: false
- id: unknown__ka
  language: ka
  kind: unknown_question
  persona: {name: ნინო, phone: '+995555100201'}
  goal: 'Ask: "Is there an electric car charger near you?"'
  customer: ['თქვენთან ახლოს ელექტრომობილის დამტენი არის?']
