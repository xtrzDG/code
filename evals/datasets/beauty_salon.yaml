# Evaluation dataset of the beauty_salon niche: Studio Rose in ka, ru, en, he, ar.
# Eight scenarios per language. `customer` and `assistant` are the reference
# conversation the scripted model plays (the seeded cassettes); a live model
# improvises from the persona and goal and is scored by `expect`
# (evals/README.md describes every field).
niche: beauty_salon
business:
  name: Studio Rose
  languages: [ka, ru, en, he, ar]
  prices: {haircut: '60', manicure: '45', hair_colouring: '150'}
  answers: {products: We use L'Oreal Professionnel and OPI., card_payment: 'Yes, we accept all major cards.'}
scenarios:
- id: price__ka
  language: ka
  kind: price_question
  item: Women's haircut
  persona: {name: ნინო, phone: '+995555100201'}
  customer: ['გამარჯობა! რა ღირს ქალის თმის შეჭრა?']
  assistant:
  - call:
      get_price: {item_name: Women's haircut}
  - {say: 'ქალის თმის შეჭრა ღირს 60 ლარი. კიდევ რამით შემიძლია დაგეხმაროთ?'}
  expect:
    prices: ['60']
    handoff: false
- id: booking__ka
  language: ka
  kind: booking
  persona: {name: ნინო, phone: '+995555100201'}
  goal: Book a women's haircut on Thursday at 13:00. Give your name and phone number, and confirm when the assistant repeats the details.
  customer: ['გამარჯობა! მინდა დავჯავშნო: ქალის თმის შეჭრა, ხუთშაბათს 13:00-ზე. მე ვარ ნინო, ტელეფონი +995 555 10 02 01.', 'დიახ, დაჯავშნეთ.']
  assistant:
  - call:
      check_availability: {date: '2026-10-08', time: '13:00', party_size: 1, nights: null, resource_type: null, duration_minutes: null}
  - {say: 'ხუთშაბათს 13:00-ზე თავისუფალია. დავჯავშნო სახელზე ნინო?'}
  - call:
      create_booking: {name: ნინო, phone: '+995555100201', resource_type: null, date: '2026-10-08', time: '13:00', party_size: 1, duration_minutes: null, nights: null, notes: null}
  - {say: 'მზადაა, ნინო! ჯავშანი გაფორმდა ხუთშაბათს, 13:00-ზე. გელოდებით!'}
  expect:
    tools:
    - check_availability
    - create_booking:
        name: [ნინო, Nino]
        phone: '+995555100201'
        party_size: 1
        date: '2026-10-08'
        time: '13:00'
    handoff: false
- id: closed__ka
  language: ka
  kind: booking_out_of_hours
  persona: {name: ნინო, phone: '+995555100201'}
  goal: Ask to book a women's haircut on Thursday at 08:00, when the business is still closed. Accept another time only if the assistant offers one within the opening hours.
  customer: ['შეიძლება დავჯავშნო ქალის თმის შეჭრა ხუთშაბათს 08:00-ზე?']
  assistant:
  - call:
      check_availability: {date: '2026-10-08', time: '08:00', party_size: 1, nights: null, resource_type: null, duration_minutes: null}
  - {say: '08:00-ზე ჯერ დაკეტილი ვართ: ხუთშაბათს 10:00-ზე ვიხსნებით. პირველი თავისუფალი დროა 10:00. დავჯავშნო?'}
  expect:
    forbidden_tools: [create_booking]
    facts: ['10:00']
    handoff: false
- id: unknown__ka
  language: ka
  kind: unknown_question
  persona: {name: ნინო, phone: '+995555100201'}
  goal: 'Ask: "Is there an electric car charger near you?"'
