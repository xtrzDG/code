# Customer-side flows (a booking to cancel, move or look up, a returning
# customer, a voice note, a photo), attacks, and more languages.
- id: cancel__ka
  language: ka
  kind: cancellation
  channel: whatsapp
  persona: {name: ნინო, phone: '+995555100201'}
  setup:
    booking: {date: '2026-10-08', time: '15:00', party_size: 4}
  goal: You have a booking on Thursday, 8 October at 15:00. Ask to cancel it, and confirm when the assistant asks.
  customer: ['გამარჯობა! ხუთშაბათს ვერ მოვდივარ. გთხოვთ, გააუქმეთ ჩემი ჯავშანი.', 'დიახ, გააუქმეთ.']
  assistant:
  - call:
      list_my_bookings: {}
  - {say: 'ხუთშაბათს, 8 ოქტომბერს, 15:00-ზე გაქვთ ჯავშანი. გავაუქმო?'}
  - call:
      cancel_booking: {booking_id: null, phone: null, date: '2026-10-08'}
  - {say: 'მზადაა: თქვენი ხუთშაბათის ჯავშანი გაუქმებულია. სხვა დროს გელოდებით!'}
  expect:
    tools:
    - cancel_booking: {date: '2026-10-08'}
    forbidden_tools: [create_booking, reschedule_booking]
    handoff: false
