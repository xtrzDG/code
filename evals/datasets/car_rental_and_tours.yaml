- {id: documents, language: it, ask: 'Che documenti servono per noleggiare un''auto?', say: 'Servono il passaporto e una patente di guida posseduta da almeno 2 anni.', facts: ['passaporto']}
- {id: rental_deposit, language: it, ask: 'Per il noleggio c''è da lasciare un deposito?', say: 'Sì, un deposito di 300 GEL, che viene restituito con l''auto.', facts: ['300']}
- {id: cancel_policy, language: it, ask: 'Fino a quando posso disdire il noleggio?', say: 'La preghiamo di disdire o cambiare la prenotazione almeno 24 ore prima del ritiro.', facts: ['24 ore']}
