- {id: seats, language: en, ask: 'How many people fit in the economy car?', say: 'The economy car takes up to 5 people.', facts: ['5 people']}
- {id: airport, language: en, ask: 'Can I pick the car up at the airport?', say: 'Yes, at our office in Tbilisi or, on request, at Tbilisi airport.', facts: ['airport']}
- {id: insurance, language: en, ask: 'Is insurance included in the price?', say: 'Basic insurance is included in every rental; full cover can be added at the office.', facts: ['Basic insurance']}
- {id: abroad, language: en, ask: 'Can I drive the rental car to Armenia?', say: 'No, our cars may only be driven within Georgia.', facts: ['within Georgia']}
