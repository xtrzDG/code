- {id: banquet, language: it, item: 'Banquet package per guest', ask: 'Buongiorno, quanto costa il banchetto a persona?', say: 'Il pacchetto banchetto costa 85 GEL a ospite.', prices: ['85']}
- {id: hall_rental, language: it, item: 'Hall rental per hour', ask: 'Quanto costa l''affitto della sala per un''ora?', say: 'L''affitto della sala costa 200 GEL all''ora.', prices: ['200']}
- {id: decoration, language: it, item: 'Hall decoration', ask: 'Quanto costa la decorazione della sala?', say: 'La decorazione della sala costa 500 GEL.', prices: ['500']}
- {id: weekday_hours, language: it, ask: 'Che orari fate durante la settimana?', say: 'Dal lunedì al venerdì siamo aperti dalle 10:00 alle 20:00.', facts: ['10:00']}
- {id: sunday, language: it, ask: 'La domenica siete aperti?', say: 'Sì, la domenica siamo aperti dalle 11:00 alle 18:00.', facts: ['18:00']}
- {id: capacity, language: it, ask: 'Quante persone può ospitare la sala principale?', say: 'La sala principale è per un massimo di 100 persone.', facts: ['100']}
- {id: own_wine, language: it, ask: 'Possiamo portare il nostro vino al matrimonio?', say: 'Sì, può portare il suo vino; il diritto di tappo è incluso.', facts: ['tappo']}
- {id: decor_help, language: it, ask: 'Potete decorare la sala con i colori del nostro matrimonio?', say: 'Sì, il nostro decoratore può allestire la sala nei vostri colori.', facts: ['decoratore']}
- {id: visit, language: it, ask: 'Posso venire a vedere la sala prima di prenotare?', say: 'Sì. Scriva qui un giorno e un orario comodi, e organizzerò una visita con il nostro manager.', facts: ['visita']}
- {id: changes, language: it, ask: 'Fino a quando posso cambiare il numero degli ospiti e il menu?', say: 'La preghiamo di comunicarci le modifiche almeno 14 giorni prima dell''evento.', facts: ['14 giorni']}
- {id: notice, language: it, ask: 'Posso prenotare la sala per domani?', say: 'Serve un preavviso di almeno 2880 minuti, quindi per domani non è possibile.', facts: ['2880']}
- {id: parking, language: it, ask: 'C''è il parcheggio per gli ospiti?', say: 'Sì, c''è un parcheggio gratuito per 40 auto accanto alla sala.', facts: ['40']}
- {id: music, language: it, ask: 'Potete organizzare la musica dal vivo?', say: 'Sì, lavoriamo con una band e un DJ; li organizza il manager.', facts: ['band']}
- {id: garden, language: it, ask: 'Possiamo fare la cerimonia all''aperto?', say: 'Sì, c''è un giardino per cerimonie all''aperto fino a 80 ospiti.', facts: ['giardino']}
- {id: vegetarian, language: it, ask: 'Alcuni ospiti sono vegetariani: c''è un menu per loro?', say: 'Sì, il menu del banchetto ha un''opzione vegetariana.', facts: ['vegetariana']}
- {id: phone, language: it, ask: 'Qual è il vostro numero di telefono?', say: 'Può chiamarci al +995 32 210 01 00.', facts: ['+995 32 210 01 00']}
