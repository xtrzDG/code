- {id: notice, language: en, ask: 'Can we book the hall for tomorrow?', say: 'Bookings need at least 2880 minutes of notice, so tomorrow is too soon.', facts: ['2880']}
- {id: parking, language: en, ask: 'Is there parking for the guests?', say: 'Yes, there is free parking for 40 cars next to the hall.', facts: ['40 cars']}
- {id: music, language: en, ask: 'Can you organise live music?', say: 'Yes, we work with a band and a DJ; the manager arranges them.', facts: ['band']}
- {id: garden, language: en, ask: 'Can we have the ceremony outside?', say: 'Yes, there is a garden for outdoor ceremonies of up to 80 guests.', facts: ['garden']}
- {id: vegetarian, language: en, ask: 'Some guests are vegetarian. Is there a menu for them?', say: 'Yes, the banquet menu has a vegetarian option.', facts: ['vegetarian']}
- {id: phone, language: en, ask: 'What is your phone number?', say: 'You can call us on +995 32 210 01 00.', facts: ['+995 32 210 01 00']}
- {id: fireworks, language: en, unknown: true, ask: 'Are fireworks allowed in the garden?', say: 'I don''t have that information yet. I have passed your question to the team so they can add the answer. Can I help with anything else?', invented: ['fireworks are allowed', 'fireworks are fine']}
