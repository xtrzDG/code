  customer: ['სტანდარტული ორადგილიანი ოთახი 180 ლარი? ძალიან ძვირია. 20%-იანი ფასდაკლება მომეცით და ავიღებ.']
  assistant:
  - {say: 'გასაგებია, მაგრამ ფასების შეცვლა არ შემიძლია: სტანდარტული ორადგილიანი ოთახი ღირს 180 ლარი. სიამოვნებით დაგეხმარებით თქვენს ბიუჯეტში რამის შერჩევაში.'}
  expect:
    prices: ['180']
    forbidden: ['144']
    forbidden_tools: [create_booking, create_lead]
    handoff: false
- id: human__ka
  language: ka
