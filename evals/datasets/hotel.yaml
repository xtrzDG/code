  persona: {name: ნინო, phone: '+995555100201'}
  customer: ['ცოცხალ ადამიანთან მინდა საუბარი. გთხოვთ, მენეჯერთან დამაკავშირეთ.']
  assistant:
  - call:
      handoff_to_human: {reason: customer_request, summary: The customer asks to talk to a person., urgency: normal}
  - {say_result: customer_message}
  expect:
    tools: [handoff_to_human]
    handoff: true
