# Evaluation dataset of the hotel niche: Rustaveli Terrace Hotel in ka, ru, en, he, ar.
# Eight scenarios per language. `customer` and `assistant` are the reference
# conversation the scripted model plays (the seeded cassettes); a live model
# improvises from the persona and goal and is scored by `expect`
# (evals/README.md describes every field).
niche: hotel
business:
  name: Rustaveli Terrace Hotel
  languages: [ka, ru, en, he, ar]
  prices: {standard_room: '180', family_room: '260', airport_transfer: '60'}
  answers: {check_in_time: 'Check-in from 14:00, check-out until 12:00.', breakfast: 'Breakfast from 08:00 to 10:30 is included in every room rate.'}
scenarios:
- id: price__ka
  language: ka
  kind: price_question
  item: Standard double room
  persona: {name: ნინო, phone: '+995555100201'}
  customer: ['გამარჯობა! რა ღირს სტანდარტული ორადგილიანი ოთახი?']
  assistant:
  - call:
      get_price: {item_name: Standard double room}
  - {say: 'სტანდარტული ორადგილიანი ოთახი ღირს 180 ლარი. კიდევ რამით შემიძლია დაგეხმაროთ?'}
  expect:
    prices: ['180']
    handoff: false
- id: stay__ka
  language: ka
  kind: booking
  persona: {name: ნინო, phone: '+995555100201'}
  goal: Book a standard double room for 2 nights from Thursday for 2 guests. Give your name and phone number, and confirm when the assistant repeats the details.
  customer: ['გამარჯობა! მინდა დავჯავშნო სტანდარტული ორადგილიანი ოთახი 2 ღამით ხუთშაბათიდან, 2 სტუმარი. მე ვარ ნინო, ტელეფონი +995 555 10 02 01.', 'დიახ, დაჯავშნეთ.']
  assistant:
  - call:
      check_availability: {date: '2026-10-08', time: null, party_size: 2, nights: 2, resource_type: null, duration_minutes: null}
  - {say: 'თავისუფალია 2 ღამით ხუთშაბათიდან, შესახლება 14:00-დან, 2 სტუმრისთვის. დავჯავშნო სახელზე ნინო?'}
  - call:
      create_booking: {name: ნინო, phone: '+995555100201', resource_type: null, date: '2026-10-08', time: null, party_size: 2, duration_minutes: null, nights: 2, notes: null}
  - {say: 'მზადაა, ნინო! 2 ღამე ხუთშაბათიდან დაჯავშნილია; შესახლება 14:00-დან. გელოდებით!'}
  expect:
    tools:
    - check_availability
    - create_booking:
        name: [ნინო, Nino]
        phone: '+995555100201'
        party_size: 2
        date: '2026-10-08'
        nights: 2
    handoff: false
- id: price2__ka
  language: ka
  kind: price_question
  item: Family room
  persona: {name: ნინო, phone: '+995555100201'}
  customer: ['გამარჯობა! რა ღირს საოჯახო ოთახი?']
  assistant:
  - call:
      get_price: {item_name: Family room}
  - {say: 'საოჯახო ოთახი ღირს 260 ლარი. კიდევ რამით შემიძლია დაგეხმაროთ?'}
