# Render Blueprint of the staging environment (Frankfurt, EU), the gate in
# front of production (render.yaml): the same image, commands and settings,
# with its own database, its own env group and its own keys. It runs with
# APP_ENV=production, so it passes exactly the checks production does
# (docs/operations/go-live.md, "Production refuses to start"): a real model,
# Turnstile, object storage, a spend budget, a seller and https addresses.
#
#   workshop-staging-db       managed Postgres 16, only for staging
#   workshop-staging-api      the API; migrations run before every deploy
#   workshop-staging-worker   the background worker (same image)
#   workshop-staging-cabinet  the owner cabinet
#
# Every service follows `main` and deploys a commit only after all its
# GitHub checks passed (`autoDeployTrigger: checksPass`). When the API is
# live, .github/workflows/deploy-smoke.yml runs scripts/smoke.sh against it
# and, if that passes, asks a reviewer of the GitHub environment
# `production-release` to promote the commit to the `release` branch
# production deploys (docs/operations/deploys.md).
#
# LLM_PROVIDER=openai with staging's own OpenAI project and key (EU data
# residency, a small budget): production refuses the scripted model, so a
# rehearsal with it would prove nothing. Staging holds test data only; the
# smoke test's chat is one real model answer per deploy (leave
# SMOKE_EXPECT_REPLY empty: any answer passes).
#
# Create it with Render -> New -> Blueprint -> this repository, Blueprint
# path `render.staging.yaml`. Secrets are `sync: false`: fill in what
# staging uses (its own addresses, one sign-in channel, ideally e-mail, its
# own Turnstile widget, bucket and OpenAI key, a test seller), and never
# production's keys or ENCRYPTION_KEY.

databases:
  - name: workshop-staging-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: workshop
    user: workshop
    ipAllowList: []

envVarGroups:
  - name: workshop-staging
    envVars:
      # The databases are reached by their internal addresses (fromDatabase
      # connectionString), on Render's private network, which does not
      # require TLS and may not offer it: no PGSSLMODE here. Production
      # still refuses any external (dotted) database address that does not
      # require TLS (app/utilities/config_helpers/production/database_tls_requirements.py).
      # Staging runs exactly the production code paths and guards.
      - key: APP_ENV
        value: production
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FORWARDED_ALLOW_IPS
        value: "10.0.0.0/8"
      - key: DEFAULT_DATA_REGION
        value: eu
      - key: LLM_PROVIDER
        value: openai
      # A test environment's budget: the spend_budget alert fires at $4, and
      # at $5 the assistants stop calling the model until UTC midnight.
      - key: PLATFORM_DAILY_SPEND_BUDGET_USD
        value: "5"

services:
  - type: web
    name: workshop-staging-api
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: workshop api
    preDeployCommand: workshop migrate
    # Readiness: the database answers and every migration of this build is
    # applied; a busy pool is "degraded" (200) and fails only after 30 s
    # (GET /healthz is liveness only).
    healthCheckPath: /readyz
    # SIGTERM first: uvicorn finishes open requests (25 s), then exits.
    maxShutdownDelaySeconds: 30
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - "**/*.md"
    envVars:
      - fromGroup: workshop-staging
      - key: PORT
        value: "8000"
      # The connection budget of production (render.yaml) with one instance;
      # the defaults (64 threads, 32 + 8 connections) would not fit
      # basic-256mb.
      - key: THREADPOOL_SIZE
        value: "40"
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_PLATFORM_POOL_SIZE
        value: "4"
      - key: LLM_MAX_CONCURRENCY
        value: "8"
      # The migration role (the tables' owner); the pools use the two login
      # roles below (docs/operations/deploys.md, "Database roles").
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-staging-db
          property: connectionString
      - key: DATABASE_URL_TENANT
        sync: false
      - key: DATABASE_URL_PLATFORM
        sync: false
      # public https address of this API, e.g. https://workshop-staging-api.onrender.com
      - key: APP_BASE_URL
        sync: false
      # public https address of the staging cabinet
      - key: CABINET_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # staging's own OpenAI project (EU data residency) and its key
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_PROJECT_ID
        sync: false
      # staging's own Turnstile widget (live keys: test keys are refused)
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # recordings, customer files and exports in staging's own EU bucket,
      # with a key limited to it (production refuses local storage)
      - key: RECORDINGS_STORAGE
        value: s3
      - key: RECORDINGS_S3_ENDPOINT_URL
        sync: false
      - key: RECORDINGS_S3_REGION
        sync: false
      - key: RECORDINGS_S3_BUCKET
        sync: false
      - key: RECORDINGS_S3_ACCESS_KEY_ID
        sync: false
      - key: RECORDINGS_S3_SECRET_ACCESS_KEY
        sync: false
      # a test seller for staging's invoices (e.g. "Workshop Staging",
      # IT, Europe/Rome)
      - key: SELLER_LEGAL_NAME
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_COUNTRY_CODE
        sync: false
      - key: SELLER_TIME_ZONE
        sync: false
      # login codes by e-mail (a test mailbox is enough)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURITY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: workshop-staging-worker
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: workshop worker
    # Running jobs get 25 s after SIGTERM; a cut-off job runs again on
    # another worker once its lease ends.
    maxShutdownDelaySeconds: 60
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - "**/*.md"
    envVars:
      - fromGroup: workshop-staging
      - key: DATABASE_URL
        fromDatabase:
          name: workshop-staging-db
          property: connectionString
      - key: DATABASE_URL_TENANT
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: DATABASE_URL_TENANT
      - key: DATABASE_URL_PLATFORM
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: DATABASE_URL_PLATFORM
      # One worker serves every lane (no WORKER_LANES): 17 lane threads, the
      # periodic thread and the heartbeat, one tenant connection each at
      # most; the queue's claims and platform-wide jobs: 4 platform
      # connections.
      - key: THREADPOOL_SIZE
        value: "20"
      - key: DB_POOL_SIZE
        value: "19"
      - key: DB_PLATFORM_POOL_SIZE
        value: "4"
      - key: LLM_MAX_CONCURRENCY
        value: "12"
      - key: APP_BASE_URL
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: APP_BASE_URL
      - key: CABINET_BASE_URL
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: CABINET_BASE_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: CORS_ALLOWED_ORIGINS
      - key: PLATFORM_ADMIN_EMAILS
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: PLATFORM_ADMIN_EMAILS
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_PROJECT_ID
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: OPENAI_PROJECT_ID
      - key: TURNSTILE_SITE_KEY
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: TURNSTILE_SITE_KEY
      - key: TURNSTILE_SECRET_KEY
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: TURNSTILE_SECRET_KEY
      - key: RECORDINGS_STORAGE
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_STORAGE
      - key: RECORDINGS_S3_ENDPOINT_URL
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_S3_ENDPOINT_URL
      - key: RECORDINGS_S3_REGION
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_S3_REGION
      - key: RECORDINGS_S3_BUCKET
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_S3_BUCKET
      - key: RECORDINGS_S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_S3_ACCESS_KEY_ID
      - key: RECORDINGS_S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: RECORDINGS_S3_SECRET_ACCESS_KEY
      - key: SELLER_LEGAL_NAME
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SELLER_LEGAL_NAME
      - key: SELLER_ADDRESS
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SELLER_ADDRESS
      - key: SELLER_COUNTRY_CODE
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SELLER_COUNTRY_CODE
      - key: SELLER_TIME_ZONE
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SELLER_TIME_ZONE
      - key: SMTP_HOST
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_HOST
      - key: SMTP_PORT
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_PORT
      - key: SMTP_SECURITY
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_SECURITY
      - key: SMTP_USERNAME
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_USERNAME
      - key: SMTP_PASSWORD
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_PASSWORD
      - key: SMTP_FROM
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SMTP_FROM
      - key: SENTRY_DSN
        fromService:
          type: web
          name: workshop-staging-api
          envVarKey: SENTRY_DSN

  - type: web
    name: workshop-staging-cabinet
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /login
    buildFilter:
      paths:
        - web/**
    envVars:
      # The staging API's internal address, e.g. http://workshop-staging-api:8000
      # (never the public one: every sign-in would share Render's egress IP).
      - key: BACKEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # the public address of the staging cabinet (https://...): canonical
      # links, sitemap.xml and robots.txt name it, never the request's Host
      - key: SITE_URL
        sync: false
      # the security mailbox (security@<your domain>): the first Contact of
      # /.well-known/security.txt; the deploy smoke test checks it is there
      - key: SECURITY_CONTACT_EMAIL
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # errors of the cabinet (server and browser); empty: none are sent
      - key: SENTRY_DSN
        sync: false
